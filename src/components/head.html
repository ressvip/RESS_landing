<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="{{title}}">
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="{{config.seo.keywords}}">
    <meta name="author" content="{{config.brand.name}}">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="{{canonicalUrl}}">
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{pageUrl}}">
    <meta property="og:site_name" content="{{config.brand.name}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:image:width" content="{{config.seo.imageWidth}}">
    <meta property="og:image:height" content="{{config.seo.imageHeight}}">
    <meta property="og:image:type" content="{{config.seo.imageType}}">
    <meta property="fb:app_id" content="{{config.seo.fbAppId}}">
    
    <!-- App Links for Messenger / Social sharing -->
    <meta property="al:ios:app_name" content="{{config.brand.name}}">
    <meta property="al:ios:app_store_id" content="{{config.seo.appleAppId}}">
    <meta property="al:android:app_name" content="{{config.brand.name}}">
    <meta property="al:android:package" content="{{config.seo.androidPackage}}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{pageUrl}}">
    <meta name="twitter:title" content="{{title}}">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="{{ogImage}}">
    
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    {{headExtra}}
</head>
